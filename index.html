<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR 空間雙機連線羅盤 V37.7 (空間感測接管鎖定版)</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1000; pointer-events: none; }
    #status-text { position: absolute; top: 40px; width: 90%; left: 5%; text-align: center; color: #34d399; font-size: 15px; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 8px; border: 1px solid rgba(52, 211, 153, 0.4); font-weight: bold; letter-spacing: 1px; pointer-events: auto; z-index: 10005; }
    #crosshair-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1001; display: none; }
    .crosshair-line-v { position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: rgba(52, 211, 153, 0.6); }
    .crosshair-line-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(52, 211, 153, 0.6); }
    #radar-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 150vmax; height: 150vmax; border-radius: 50%; border: 2px solid rgba(52, 211, 153, 0.08); display: none; }
    #radar-sweep { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(from 0deg, rgba(52, 211, 153, 0) 0%, rgba(52, 211, 153, 0.5) 100%); opacity: 0; animation: spin 1.5s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    #circle-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95px; height: 95px; border-radius: 50%; background: rgba(2, 44, 34, 0.9); border: 2px solid #34d399; color: #34d399; font-weight: bold; font-size: 14px; display: none; justify-content: center; align-items: center; pointer-events: auto; box-shadow: 0 0 20px rgba(52, 211, 153, 0.4); z-index: 10006; }
    #magician-zone { position: absolute; bottom: 0; right: 0; width: 140px; height: 140px; pointer-events: auto; background: transparent; z-index: 9999; display: none; }
    #qr-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0a0a0a; z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; color: #34d399; }
    #qr-image { border: 8px solid #10b981; border-radius: 12px; background: white; padding: 10px; }
  </style>
</head>
<body>

  <div id="qr-overlay">
    <h2>🧙‍♂️ 魔術師演出主控台</h2>
    <img id="qr-image" src="" alt="Audience QR Code">
  </div>

  <div id="ui-layer">
    <div id="status-text">Searching....</div>
    <div id="crosshair-container">
      <div class="crosshair-line-v"></div>
      <div class="crosshair-line-h"></div>
    </div>
    <div id="radar-container"><div id="radar-sweep"></div></div>
    <div id="circle-btn">SCAN</div>
    <div id="magician-zone"></div>
  </div>

  <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.1; filterBeta: 10" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: true; touchEnabled: false"></a-camera>
    
    <a-entity mindar-image-target="targetIndex: 0" id="target-anchor">
      <a-plane id="hit-plane" position="0 0 0" scale="15 15 1" material="transparent: true; opacity: 0;"></a-plane>
    </a-entity>

    <a-entity id="global-world-marker" visible="false">
      <a-sphere position="0 0 1.0" radius="0.08" material="color: #00ff00;"></a-sphere>
      <a-cylinder position="0 0 0.5" radius="0.016" height="1.0" rotation="90 0 0" material="color: #00ff00; opacity: 0.7; transparent: true"></a-cylinder>
    </a-entity>
  </a-scene>

  <script>
    const firebaseConfig = { databaseURL: "https://magic-ar-radar-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("magic_space_node");
    
    const urlParams = new URLSearchParams(window.location.search);
    const myRole = urlParams.get('role') || 'audience'; 
    
    const statusText = document.getElementById('status-text');
    const crosshairContainer = document.getElementById('crosshair-container'); 
    const radarContainer = document.getElementById('radar-container');
    const radarSweep = document.getElementById('radar-sweep');
    const scanBtn = document.getElementById('circle-btn');
    const magicianZone = document.getElementById('magician-zone');
    const qrOverlay = document.getElementById('qr-overlay');
    
    const targetAnchor = document.getElementById('target-anchor');
    const globalWorldMarker = document.getElementById('global-world-marker');
    const hitPlane = document.getElementById('hit-plane');
    const sceneEl = document.querySelector('a-scene');
    
    let isTargetTracked = false;
    let hasLoggedStaticPosition = false; // 🚀 是否已經成功捕獲並鎖定靜態座標
    let magicData = null; 
    let scanTimer = null; 
    let isRadarActive = false; 
    let blinkInterval = null;  

    if (myRole === 'magician') {
      magicianZone.style.display = 'block'; 
      const audienceUrl = window.location.origin + window.location.pathname;
      document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(audienceUrl)}`;
      qrOverlay.style.display = 'flex';
      crosshairContainer.style.display = 'none';

      qrOverlay.addEventListener('click', () => {
        qrOverlay.style.display = 'none';
        crosshairContainer.style.display = 'block'; 
        db.set({ status: "ready" }); 
      });
    } else {
      crosshairContainer.style.display = 'block';
    }

    db.on('value', (snapshot) => {
      magicData = snapshot.val();
      lockAndFreezeCoordinates(); // 收到雲端資料時，嘗試將其轉換為世界靜態座標
      updateUIState(); 
    });

    targetAnchor.addEventListener("targetFound", event => {
      isTargetTracked = true;
      lockAndFreezeCoordinates(); // 只要一抓到鬼牌，秒鎖定！
      updateUIState();
    });
    
    targetAnchor.addEventListener("targetLost", event => {
      isTargetTracked = false;
      // 🚀 核心秘密：這裡不再關閉圖釘，不再變回 Searching！
      // 因為圖釘已經移交給「裝置空間」，就算鬼牌不見了，圖釘依然會焊在桌面上！
      if (!hasLoggedStaticPosition) {
        cancelScan();
      }
      updateUIState(); 
    });

    function updateUIState() {
      // 如果已經成功捕獲過一次靜態座標，畫面永遠顯示為正常運作狀態，徹底免去科技焦慮
      if (hasLoggedStaticPosition) {
        if (isRadarActive) {
          statusText.innerText = "System Synced. Target Found.";
          statusText.style.color = "#34d399";
          globalWorldMarker.setAttribute('visible', 'true');
          if (!blinkInterval) startRadarBlinkingEffect();
        } else {
          statusText.innerText = "Press SCAN to find your card";
          statusText.style.color = "#34d399";
          scanBtn.style.display = 'flex';
        }
        return;
      }

      if (!isTargetTracked) {
        statusText.innerText = "Searching....";
        statusText.style.color = "#34d399";
        scanBtn.style.display = 'none';
        return;
      }

      statusText.innerText = "Press SCAN to find your card";
      scanBtn.style.display = 'flex'; 
    }

    // 🚀 終極核心：將「鬼牌相對座標」一次性轉換並鎖定為「宇宙絕對世界座標」
    function lockAndFreezeCoordinates() {
      if (!isTargetTracked || !magicData || magicData.status !== "locked" || hasLoggedStaticPosition) return;

      const THREE = AFRAME.THREE;
      
      // 1. 創立一個虛擬點，套用雲端傳來的、粘在鬼牌上的相對物理座標
      const localPos = new THREE.Vector3(magicData.physX, magicData.physY, 0);
      
      // 2. 利用當前的矩陣，將這個點轉換為「此時房間宇宙的絕對 3D 世界座標」
      const worldPos = new THREE.Vector3();
      targetAnchor.object3D.localToWorld(localPos.clone(), worldPos);

      // 3. 原封不動把這個座標交給脫離了 MindAR 限制的世界圖釘
      globalWorldMarker.setAttribute('position', `${worldPos.x} ${worldPos.y} ${worldPos.z}`);
      
      // 4. 🔒 狀態解耦旗標立起：之後這台手機再也不去重新計算、不理會鬼牌，永遠用這個座標！
      hasLoggedStaticPosition = true; 
    }

    magicianZone.addEventListener('click', (e) => {
      if (!isTargetTracked) return;

      const THREE = AFRAME.THREE;
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), sceneEl.camera); 
      
      const hitMesh = hitPlane.getObject3D('mesh');
      const intersects = raycaster.intersectObject(hitMesh, true);
      
      if (intersects.length > 0) {
        const point = intersects[0].point;
        const localPos = targetAnchor.object3D.worldToLocal(point.clone());
        db.set({ status: "locked", physX: localPos.x, physY: localPos.y });
        if (navigator.vibrate) navigator.vibrate(60); 
      }
    });

    function startScan(e) {
      if (e.cancelable) e.preventDefault();
      // 只要捕捉過一次，就算現在照不到鬼牌，也允許長按 SCAN！
      if (!isTargetTracked && !hasLoggedStaticPosition) return;

      radarContainer.style.display = 'block';
      radarSweep.style.opacity = '1';
      statusText.innerText = "Analyzing space dimension...";
      statusText.style.color = "#facc15";

      scanTimer = setTimeout(() => { executeScanSuccess(); }, 2000); 
    }

    function cancelScan() {
      if (scanTimer && !isRadarActive) {
        clearTimeout(scanTimer);
        scanTimer = null;
        radarSweep.style.opacity = '0';
        radarContainer.style.display = 'none';
        statusText.innerText = "Press SCAN to find your card";
        statusText.style.color = "#34d399";
      }
    }

    function executeScanSuccess() {
      scanTimer = null;
      if (magicData && magicData.status === "locked") {
        isRadarActive = true; 
        scanBtn.style.display = 'none'; 
        globalWorldMarker.setAttribute('visible', 'true');
        startRadarBlinkingEffect();
        if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
      }
    }

    function startRadarBlinkingEffect() {
      if (blinkInterval) clearInterval(blinkInterval);
      blinkInterval = setInterval(() => {
        setTimeout(() => globalWorldMarker.setAttribute('visible', 'false'), 0);
        setTimeout(() => globalWorldMarker.setAttribute('visible', 'true'), 120);
        setTimeout(() => globalWorldMarker.setAttribute('visible', 'false'), 240);
        setTimeout(() => globalWorldMarker.setAttribute('visible', 'true'), 360);
      }, 1500);
    }

    scanBtn.addEventListener('touchstart', startScan, { passive: false });
    scanBtn.addEventListener('touchend', cancelScan);
    scanBtn.addEventListener('touchcancel', cancelScan);
    scanBtn.addEventListener('mousedown', startScan);
    scanBtn.addEventListener('mouseup', cancelScan);
    scanBtn.addEventListener('mouseleave', cancelScan);
  </script>
</body>
</html>
