<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR 空間雙機連線羅盤 V37.21 (蓄力視覺回饋版)</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1000; pointer-events: none; }
    
    /* 魔術師專屬：右上角圓形懸浮 QR 喚醒鈕 */
    #qr-toggle-btn { position: absolute; top: 20px; right: 20px; width: 50px; height: 50px; text-align: center; color: #34d399; font-size: 15px; background: rgba(0,0,0,0.85); border-radius: 50%; border: 1px solid rgba(52, 211, 153, 0.4); font-weight: bold; cursor: pointer; pointer-events: auto; z-index: 10006; display: none; line-height: 48px; padding: 0; box-sizing: border-box; }

    #crosshair-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1001; display: block; }
    .crosshair-line-v { position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: rgba(52, 211, 153, 0.4); transform: translateX(-0.5px); }
    .crosshair-line-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(52, 211, 153, 0.4); transform: translateY(-0.5px); }

    #radar-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 150vmax; height: 150vmax; border-radius: 50%; border: 2px solid rgba(52, 211, 153, 0.08); display: none; }
    #radar-sweep { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(from 0deg, rgba(52, 211, 153, 0) 0%, rgba(52, 211, 153, 0.03) 60%, rgba(52, 211, 153, 0.5) 100%); opacity: 0; transition: opacity 0.3s ease; animation: spin 1.5s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    /* 🟢 核心修改：將 SCAN 按鈕改為可容納水位動畫的容器 */
    #circle-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95px; height: 95px; border-radius: 50%; background: rgba(2, 44, 34, 0.9); border: 2px solid #34d399; display: none; justify-content: center; align-items: center; cursor: pointer; pointer-events: auto; box-shadow: 0 0 20px rgba(52, 211, 153, 0.4); transition: transform 0.1s; overflow: hidden; /* 確保水位不會超出圓形邊界 */ z-index: 10006; }
    #circle-btn:active { transform: translate(-50%, -50%) scale(0.9); }
    
    /* 蓄力水位填充層 */
    .btn-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(52, 211, 153, 0.6); z-index: 0; }
    
    /* SCAN 文字層 (需浮在水位之上) */
    .btn-text { position: relative; color: #34d399; font-weight: bold; font-size: 14px; letter-spacing: 1px; z-index: 1; }

    #magician-zone { position: absolute; bottom: 0; right: 0; width: 140px; height: 140px; pointer-events: auto; background: transparent; z-index: 9999; display: none; }

    /* 魔術師專屬 QR Code 面板 */
    #qr-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 10, 10, 0.95); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; color: #34d399; font-family: sans-serif; pointer-events: auto; box-sizing: border-box; }
    #qr-overlay h2 { margin-bottom: 5px; color: #fff; font-size: 20px; }
    #qr-overlay p { margin-bottom: 25px; font-size: 14px; color: #a7f3d0; }
    #qr-image { border: 8px solid #10b981; border-radius: 12px; background: white; padding: 10px; }
    #qr-footer { margin-top: 30px; font-size: 13px; color: #6ee7b7; opacity: 0.8; text-align: center; padding: 0 20px; font-weight: bold; }

    .mindar-ui-scanning { display: none !important; }
  </style>
</head>
<body>

  <div id="qr-overlay">
    <h2>🧙‍♂️ 魔術師演出主控台</h2>
    <p>請讓觀眾的手機掃描下方條碼：</p>
    <img id="qr-image" src="" alt="Audience QR Code">
    <div id="qr-footer">💡 觀眾掃描完成後，【點擊螢幕任意處】即可隱藏此條碼</div>
  </div>

  <div id="ui-layer">
    <button id="qr-toggle-btn">QR</button>
    
    <div id="crosshair-container">
      <div class="crosshair-line-v"></div>
      <div class="crosshair-line-h"></div>
    </div>

    <div id="radar-container"><div id="radar-sweep"></div></div>
    
    <div id="circle-btn">
      <div class="btn-fill" id="btn-fill"></div>
      <span class="btn-text">SCAN</span>
    </div>
    
    <div id="magician-zone"></div>
  </div>

  <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.1; filterBeta: 10; uiScanning: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <a-entity mindar-image-target="targetIndex: 0" id="target-anchor">
      <a-plane id="hit-plane" position="0 0 0" scale="15 15 1" material="transparent: true; opacity: 0;"></a-plane>
      
      <a-entity id="target-marker" visible="false">
        <a-circle position="0 0 0.02" radius="0.05" material="color: #00ff00; shader: flat; side: double;"></a-circle>
        <a-ring position="0 0 0.01" radius-inner="0.07" radius-outer="0.09" material="color: #00ff00; shader: flat; opacity: 0.6; side: double;"></a-ring>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const firebaseConfig = { databaseURL: "https://magic-ar-radar-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("magic_space_node");
    
    const urlParams = new URLSearchParams(window.location.search);
    const myRole = urlParams.get('role') || 'audience'; 
    
    const radarContainer = document.getElementById('radar-container');
    const radarSweep = document.getElementById('radar-sweep');
    const scanBtn = document.getElementById('circle-btn');
    const btnFill = document.getElementById('btn-fill'); // 🟢 獲取水位動畫元素
    const magicianZone = document.getElementById('magician-zone');
    const qrOverlay = document.getElementById('qr-overlay');
    const qrToggleBtn = document.getElementById('qr-toggle-btn');
    
    const targetAnchor = document.getElementById('target-anchor');
    const targetMarker = document.getElementById('target-marker');
    const hitPlane = document.getElementById('hit-plane');
    const sceneEl = document.querySelector('a-scene');
    
    let isTargetTracked = false;
    let magicData = null; 
    let holdTimer = null;       
    let radarAnimationTimer = null; 
    let isHolding = false;      
    let isAnimatingRadar = false; 
    let isRadarActive = false;   
    let blinkInterval = null;  

    // 初始化角色權限與 QR Code
    if (myRole === 'magician') {
      magicianZone.style.display = 'block'; 
      qrToggleBtn.style.display = 'block'; 
      
      const audienceUrl = window.location.origin + window.location.pathname;
      document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(audienceUrl)}`;
      qrOverlay.style.display = 'flex'; 

      qrOverlay.addEventListener('click', () => { qrOverlay.style.display = 'none'; });
      qrToggleBtn.addEventListener('click', () => {
        qrOverlay.style.display = qrOverlay.style.display === 'flex' ? 'none' : 'flex';
      });

      db.set({ status: "ready" }); 
    }

    // 監聽雲端資料庫
    db.on('value', (snapshot) => {
      magicData = snapshot.val();
      applyPhysicalCoordinates(); 
      updateUIState(); 
    });

    // AR 追蹤事件
    targetAnchor.addEventListener("targetFound", event => {
      isTargetTracked = true;
      applyPhysicalCoordinates();
      updateUIState();
    });
    
    targetAnchor.addEventListener("targetLost", event => {
      isTargetTracked = false;
      cancelScan(); // 若追蹤丟失，自動中斷蓄力
      if (isAnimatingRadar) stopRadarAnimation();
      updateUIState(); 
      if (blinkInterval) { clearInterval(blinkInterval); blinkInterval = null; }
      targetMarker.setAttribute('visible', 'false');
    });

    // 核心 UI 控制
    function updateUIState() {
      if (isAnimatingRadar) return;

      if (!isTargetTracked) {
        scanBtn.style.display = 'none';
        return;
      }

      if (isRadarActive) {
        scanBtn.style.display = 'none';
        targetMarker.setAttribute('visible', 'true');
        if (!blinkInterval) startDotBlinkingEffect();
        return;
      }

      targetMarker.setAttribute('visible', 'false');
      if (blinkInterval) { clearInterval(blinkInterval); blinkInterval = null; }

      if (myRole === 'magician') {
        if (magicData && magicData.status === "locked") {
          scanBtn.style.display = 'flex';
        } else {
          scanBtn.style.display = 'none';
        }
      } else {
        scanBtn.style.display = 'flex';
      }
    }

    function applyPhysicalCoordinates() {
      if (!magicData || magicData.status !== "locked") return;
      targetMarker.setAttribute('position', `${magicData.physX} ${magicData.physY} 0`);
    }

    // 魔術師秘密定錨
    magicianZone.addEventListener('click', (e) => {
      if (!isTargetTracked) return;
      const THREE = AFRAME.THREE;
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), sceneEl.camera); 
      
      const hitMesh = hitPlane.getObject3D('mesh');
      const intersects = raycaster.intersectObject(hitMesh, true);
      
      if (intersects.length > 0) {
        const point = intersects[0].point;
        const localPos = targetAnchor.object3D.worldToLocal(point.clone());
        db.set({ status: "locked", physX: localPos.x, physY: localPos.y });
        if (navigator.vibrate) navigator.vibrate(60); 
      }
    });

    // 🟢 核心修改：按下 SCAN，啟動線性填滿動畫
    function startScan(e) {
      if (e.cancelable) e.preventDefault();
      if (!isTargetTracked || isRadarActive || isAnimatingRadar) return;

      isHolding = true;
      
      // 啟動綠色水位的 CSS 均速增長動畫 (耗時 2 秒)
      btnFill.style.transition = 'height 2s linear';
      btnFill.style.height = '100%';

      holdTimer = setTimeout(() => {
        startRadarAnimation();
      }, 2000); 
    }

    // 🟢 核心修改：鬆開 SCAN，瞬間排空動畫
    function cancelScan() {
      if (isHolding && !isAnimatingRadar) {
        clearTimeout(holdTimer);
        holdTimer = null;
        isHolding = false;
        
        // 瞬間中斷並在 0.3 秒內退回底部
        btnFill.style.transition = 'height 0.3s ease-out';
        btnFill.style.height = '0%';
        
        updateUIState();
      }
    }

    // 啟動雷達動畫
    function startRadarAnimation() {
      isHolding = false;
      holdTimer = null;
      isAnimatingRadar = true;

      // 雷達觸發後，重置按鈕水位狀態以備未來使用
      btnFill.style.transition = 'none';
      btnFill.style.height = '0%';

      scanBtn.style.display = 'none';
      radarContainer.style.display = 'block';
      radarSweep.style.opacity = '1';
      
      if (navigator.vibrate) navigator.vibrate(120);

      radarAnimationTimer = setTimeout(() => {
        executeScanSuccess();
      }, 2000);
    }

    function stopRadarAnimation() {
      clearTimeout(radarAnimationTimer);
      radarAnimationTimer = null;
      isAnimatingRadar = false;
      radarSweep.style.opacity = '0';
      radarContainer.style.display = 'none';
    }

    function executeScanSuccess() {
      stopRadarAnimation();

      if (magicData && magicData.status === "locked") {
        isRadarActive = true; 
        applyPhysicalCoordinates(); 
        updateUIState(); 
        if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
      } else {
        updateUIState();
      }
    }

    function startDotBlinkingEffect() {
      if (blinkInterval) clearInterval(blinkInterval);
      
      let isDotVisible = true;
      blinkInterval = setInterval(() => {
        if (!isTargetTracked) return;
        isDotVisible = !isDotVisible;
        targetMarker.setAttribute('visible', isDotVisible ? 'true' : 'false');
      }, 350);
    }

    // 事件綁定
    scanBtn.addEventListener('touchstart', startScan, { passive: false });
    scanBtn.addEventListener('touchend', cancelScan);
    scanBtn.addEventListener('touchcancel', cancelScan);
    scanBtn.addEventListener('mousedown', startScan);
    scanBtn.addEventListener('mouseup', cancelScan);
    scanBtn.addEventListener('mouseleave', cancelScan);
  </script>
</body>
</html>
